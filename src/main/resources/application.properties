spring.application.name=hospital-management-system

# Application runtime database account
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital_management_db
spring.datasource.username=hms_app
spring.datasource.password=${HMS_APP_PASSWORD}

# Flyway uses a separate migration account
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/hospital_management_db
spring.flyway.user=hms_migrator
spring.flyway.password=${HMS_MIGRATOR_PASSWORD}

# Keep Flyway's existing migration history in public
spring.flyway.default-schema=public

# Actuator health checks
management.endpoint.health.show-details=never
